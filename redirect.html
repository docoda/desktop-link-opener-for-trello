<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="redirectTitle">Opening in Trello…</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; display: grid; place-items: center;
           height: 100vh; margin: 0; background: #f4f5f7; color: #172b4d; }
    .box { text-align: center; max-width: 32em; padding: 0 1em; }
    a { color: #0c66e4; cursor: pointer; }
    .hint { opacity: .75; font-size: 14px; }
    [hidden] { display: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #1d2125; color: #c7d1db; } a { color: #579dff; }
    }
  </style>
</head>
<body>
  <div class="box">
    <p data-i18n="redirectOpening">Opening in the Trello desktop app…</p>
    <p class="hint" id="hint" data-i18n="redirectNotOpened" hidden></p>
    <p><a id="web" data-i18n="redirectOpenInBrowser">Open in browser instead</a></p>
  </div>
  <script src="redirect.js"></script>
</body>
</html>
